name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build --if-present

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Check for Playwright config
        id: pw
        run: |
          if [ -f apps/web/playwright.config.ts ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.pw.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.pw.outputs.exists == 'true'
        run: npm ci
      - if: steps.pw.outputs.exists == 'true'
        name: Install Playwright browsers
        run: |
          npx playwright install --with-deps chromium
          npx playwright install --with-deps msedge || echo "msedge channel not available on this runner; continuing with chromium"
      - if: steps.pw.outputs.exists == 'true'
        run: npm run build --if-present
      - if: steps.pw.outputs.exists == 'true'
        run: npx playwright test -c apps/web
      - if: steps.pw.outputs.exists == 'false'
        run: echo "apps/web/playwright.config.ts not found; skipping e2e"
