- 'మీ గత ఆర్డర్‌పై {amount} క్యాష్‌బ్యాక్ మిగిలి ఉంది. పొందడానికి కార్డ్ వివరాలు ఈ లింక్‌లో నమోదు చేయండి: {link}'
