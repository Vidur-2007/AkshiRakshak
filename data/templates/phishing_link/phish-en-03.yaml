family: phish-en-03
label: scam
category: phishing_link
lang: en
script: latn
channel: email
hard_negative: false
max_rows: 15
pools:
  link: shorteners
templates:
- 'Subject: Action required on your {bank} account. Dear Customer, during our routine check we found that your contact details are not updated. Please confirm your details {deadline} using the secure link {link} to avoid interruption of services. Regards, {bank} Customer Support'
- 'Subject: Your mailbox is almost full. Your email storage has reached 98 percent. Incoming mails will be rejected {deadline}. Click {link} and sign in to increase your quota for free.'
- Dear user, your {bank} internet banking profile was accessed from another city on {date}. Verify your identity at {link} within the next few hours or your profile will be disabled.
- 'Subject: Pending tax document. Your Form 16 and a refund note of {amount} are attached to your profile. Sign in with your net banking credentials at {link} to download.'
- Hi, the invoice for last month is still unpaid and your service will be suspended {deadline}. View the invoice and pay online here {link}. This is a system generated mail.
notes: Email-style phishing with shortened links
