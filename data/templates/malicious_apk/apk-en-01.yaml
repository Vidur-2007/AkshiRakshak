- PM Kisan beneficiary list is updated. Install {app} to check your name and receive the next instalment of {amount}.
- Your electricity bill is ready. Open the attached {app} to view and pay. Allow all permissions for the app to work.
notes: 'APK files: wedding card, challan, bank app'
