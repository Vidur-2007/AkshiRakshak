family: otps-en-01
label: scam
category: otp_theft
lang: en
script: latn
channel: whatsapp
hard_negative: false
max_rows: 14
pools:
  brand: brands.ecommerce
templates:
- Hi, I entered your number by mistake while registering. A 6 digit code has come to your phone, please send it to me quickly.
- Sir I am the delivery boy from {brand}. Your order is cancelled by mistake. Tell me the OTP that came to your mobile to rebook it.
- Dear customer, to stop the transaction of {amount} from your {bank} card, share the OTP sent to your number with our executive immediately.
- Hey it is me, I lost my phone and this is my new number. I sent my WhatsApp code to your phone, can you forward it to me right now?
- '{bank} verification: An OTP has been sent to you. Reply to this message with the OTP {deadline} to confirm your identity and avoid account blocking.'
notes: Share the code you just received
