templates:
- హాయ్, పొరపాటున మీ నంబర్ ఇచ్చాను. మీకు ఆరు అంకెల కోడ్ వచ్చి ఉంటుంది, దయచేసి త్వరగా పంపండి.
- '{bank} నుండి మాట్లాడుతున్నాం. మీ కార్డ్ బ్లాక్ కాకుండా ఉండాలంటే ఇప్పుడు వచ్చిన ఓటీపీ చెప్పండి.'
- నేను గ్రూప్ అడ్మిన్‌ని. మీ వాట్సాప్ ధృవీకరణ కోసం మీ ఫోన్‌కు వచ్చిన కోడ్ నాకు పంపండి.
- మీ {bank} రివార్డ్ పాయింట్లను {amount} నగదుగా మార్చడానికి ఇప్పుడు వచ్చిన ఓటీపీని ఈ చాట్‌లో టైప్ చేయండి, {deadline} గడువు ముగుస్తుంది.
