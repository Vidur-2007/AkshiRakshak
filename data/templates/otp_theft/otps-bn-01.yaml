- আমার ফোন হারিয়ে গেছে, এটা আমার নতুন নম্বর। আমার হোয়াটসঅ্যাপের কোড আপনার ফোনে পাঠিয়েছি, {deadline} আমাকে পাঠিয়ে দিন।
