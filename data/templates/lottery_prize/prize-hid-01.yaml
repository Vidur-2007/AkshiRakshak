- मुबारक हो, आपकी {amount} की लॉटरी लगी है। अपना नाम, बैंक खाता और प्रोसेसिंग शुल्क भेजें। किसी को मत बताना, नहीं तो इनाम रद्द हो जाएगा।
notes: Devanagari lottery
