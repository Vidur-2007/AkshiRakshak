- দাদা, আপনার সাইকেলটা আমি নেব। অগ্রিম {amount} পাঠাতে রিকোয়েস্ট দিয়েছি, অ্যাপে দেখে অ্যাপ্রুভ করে পিন দিন।
- আমি আর্মিতে আছি, ক্যাম্পের নিয়মে সরাসরি টাকা পাঠাতে পারি না। {upi} থেকে আসা {amount} রিকোয়েস্টটা মেনে নিন, টাকা আপনার কাছে চলে আসবে।
- পেমেন্ট ফেল হয়েছে, আবার রিকোয়েস্ট পাঠালাম। এবার তাড়াতাড়ি পিন দিন, না হলে অর্ডার বাতিল হয়ে যাবে।
- ম্যাডাম, আপনার ফ্রিজের দাম {amount} পাঠাচ্ছি। {upi} থেকে রিকোয়েস্ট গেছে, টাকা পেতে শুধু পিন দিয়ে অ্যাক্সেপ্ট করুন।
