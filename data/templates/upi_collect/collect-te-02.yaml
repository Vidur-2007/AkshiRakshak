- నేను మీ బైక్ కొంటాను సార్. అడ్వాన్స్ {amount} పంపడానికి రిక్వెస్ట్ పెట్టాను, యాప్‌లో చూసి అప్రూవ్ చేసి పిన్ వేయండి.
- నేను ఆర్మీలో ఉన్నాను, క్యాంప్ నియమాల వల్ల నేరుగా పంపలేను. {upi} నుండి వచ్చిన {amount} రిక్వెస్ట్ అంగీకరిస్తే మీకు డబ్బు జమ అవుతుంది.
- సార్ పేమెంట్ ఫెయిల్ అయింది, మళ్లీ రిక్వెస్ట్ పంపాను. ఈసారి త్వరగా పిన్ ఎంటర్ చేయండి, లేకపోతే ఆర్డర్ క్యాన్సిల్ అవుతుంది.
- మేడమ్, మీ ఫ్రిజ్ ధర {amount} పంపుతున్నాను. {upi} నుండి రిక్వెస్ట్ వచ్చింది, డబ్బు అందుకోవడానికి పిన్ వేసి అంగీకరించండి.
notes: Telugu buyer collect request
