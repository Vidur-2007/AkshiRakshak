family: collect-en-01
label: scam
category: upi_collect
lang: en
script: latn
channel: whatsapp
hard_negative: false
max_rows: 15
pools:
  upi: upi_ids.refund
templates:
- Sir your refund of {amount} is approved. I have sent a request on your UPI app from {upi}. Just open it, tap Pay and enter your UPI PIN, the money will come to your account in 2 minutes.
- Hello, this is the {brand} refund team. To receive your refund of {amount}, accept the collect request from {upi} and enter your PIN to confirm. Please do it {deadline} or the refund will lapse.
- Your cashback of {amount} is waiting. We have sent a payment request to your number. Approve it with your UPI PIN to receive the amount instantly.
- Dear customer, excess amount of {amount} was charged on your last bill. To get it back, approve the request sent from {upi} in your UPI app. Enter PIN to receive money.
- Madam I already sent the refund request of {amount}, why are you not accepting? Open PhonePe, you will see a request from {upi}, click on pay and put your PIN, then only the amount will be credited.
notes: 'Refund through a collect request: approve and enter PIN to receive'
