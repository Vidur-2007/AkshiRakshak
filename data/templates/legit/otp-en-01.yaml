family: otp-en-01
label: legit
category: null
lang: en
script: latn
channel: sms
hard_negative: true
amount: legit_debit
templates:
  - "{otp} is your OTP for txn of {amount} at AMAZON on your {bank} card. Valid for 10 mins. Do not share OTP with anyone. -{bank}"
  - "Dear Customer, {otp} is the OTP to log in to {bank} NetBanking. It is valid for 5 minutes. {bank} will never call you to ask for this OTP."
  - "OTP for your {bank} UPI registration is {otp}. Do NOT share it with anyone, including bank staff. If you did not request it, ignore this SMS."
  - "{otp} is your one time password for adding a payee in {bank} mobile banking. Never share your OTP, PIN or password with anyone."
  - "Use OTP {otp} to authorise your transaction of {amount} on {date}. Do not disclose this OTP to anyone. -{bank}"
notes: "Genuine bank OTP SMS: OTP plus a 'do not share' warning, no link, no request to call anyone. Hard negative for ASKS_OTP-style rules."
