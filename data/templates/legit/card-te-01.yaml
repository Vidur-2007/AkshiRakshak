- మీ {bank} క్రెడిట్ కార్డ్ XX[#4] తో {date} న {amount} లావాదేవీ జరిగింది. ఇది మీరు చేయకపోతే కార్డ్ వెనుక ఉన్న నంబర్‌కు కాల్ చేయండి.
- మీ {bank} క్రెడిట్ కార్డ్ బిల్లు {amount}. చెల్లించాల్సిన చివరి తేదీ {date}. ఆటో-డెబిట్ సెట్ చేసి ఉంటే ఎలాంటి చర్య అవసరం లేదు.
- మీ కొత్త {bank} డెబిట్ కార్డ్ పంపబడింది. యాప్‌లో లేదా ఏటీఎంలో మీరే పిన్ సెట్ చేసుకోండి. పిన్‌ను ఎవరికీ చెప్పకండి.
- ఆన్‌లైన్ లావాదేవీల కోసం మీ కార్డ్ పరిమితి మార్చబడింది. ఇది మీరు చేయకపోతే {bank} యాప్‌లో కార్డ్‌ను బ్లాక్ చేయండి.
