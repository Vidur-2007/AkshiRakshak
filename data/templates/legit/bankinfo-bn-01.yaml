templates:
- '{bank} কখনও ফোন, এসএমএস বা ইমেলে আপনার ওটিপি, পিন বা পাসওয়ার্ড চায় না। এগুলো কাউকে বলবেন না। প্রতারণার অভিযোগ জানাতে 1930 নম্বরে কল করুন।'
- প্রিয় গ্রাহক, আপনার {bank} অ্যাকাউন্টের কেওয়াইসি আপডেট করতে হবে। দয়া করে পরিচয়পত্র নিয়ে নিকটবর্তী শাখায় আসুন। এর জন্য কোনো লিঙ্ক বা ওটিপি লাগে না।
- আপনার চেক বই {date} তারিখে ডাকে পাঠানো হয়েছে। সাত কর্মদিবসের মধ্যে আপনার ঠিকানায় পৌঁছাবে। -{bank}
- 'নিরাপদ ব্যাংকিং: টাকা পেতে কখনও কিউআর কোড স্ক্যান করা বা ইউপিআই পিন দেওয়ার দরকার হয় না। সতর্ক থাকুন। -{bank}'
notes: Genuine Bengali bank advisories
