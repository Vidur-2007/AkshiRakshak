- నేను ముంబై నార్కోటిక్స్ విభాగం నుండి ఇన్‌స్పెక్టర్ {name}. మీ పేరుతో విదేశాలకు వెళ్తున్న పార్సెల్‌లో పాస్‌పోర్ట్‌లు, డ్రగ్స్ దొరికాయి. వీడియో కాల్‌లో విచారణకు హాజరు కావాలి.
- ఈ కేసు జాతీయ భద్రతకు సంబంధించినది. మీ డబ్బు చట్టబద్ధమైనదో కాదో తనిఖీ చేయడానికి మొత్తం {amount} ఆర్బీఐ ధృవీకరణ ఖాతాకు బదిలీ చేయండి. విచారణ తర్వాత తిరిగి వస్తుంది.
- మీరు ఇప్పుడు డిజిటల్ కస్టడీలో ఉన్నారు. ఫోన్ పక్కన పెట్టవద్దు, ఎవరితోనూ మాట్లాడవద్దు. ప్రతి గంటకు రిపోర్ట్ చేయాలి, లేకపోతే అరెస్ట్ వారెంట్ అమలు చేస్తాం.
- నేను సీబీఐ అధికారి {name}. మీ ఆధార్‌తో తెరిచిన ఖాతాలో హవాలా డబ్బు జమ అయింది. వెంటనే {phone} కు వీడియో కాల్ చేయండి, లేకపోతే {deadline} పోలీసులు మీ ఇంటికి వస్తారు.
