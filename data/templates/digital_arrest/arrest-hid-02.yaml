- मैं मुंबई नारकोटिक्स विभाग से इंस्पेक्टर {name} बोल रहा हूं। आपके नाम से विदेश जा रहे पार्सल में पासपोर्ट और ड्रग्स मिले हैं। वीडियो कॉल पर पूछताछ में शामिल होना होगा।
- यह मामला राष्ट्रीय सुरक्षा का है। आपका पैसा वैध है या नहीं, यह जांचने के लिए पूरे {amount} आरबीआई सत्यापन खाते में भेजें। जांच के बाद लौटा दिए जाएंगे।
- आप अब डिजिटल हिरासत में हैं। फोन मत रखिए, किसी से बात मत कीजिए। हर घंटे रिपोर्ट करनी है, वरना गिरफ्तारी वारंट लागू होगा।
