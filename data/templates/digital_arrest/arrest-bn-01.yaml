templates:
- আমি সাইবার ক্রাইম ব্রাঞ্চ থেকে {name} বলছি। আপনার আধার দিয়ে বুক করা পার্সেলে মাদক পাওয়া গেছে। আপনি ডিজিটাল অ্যারেস্টে আছেন। ভিডিও কলে থাকুন এবং কাউকে কিছু বলবেন না।
- আপনার মোবাইল নম্বর মানি লন্ডারিং মামলার সঙ্গে যুক্ত। আপনার নামে গ্রেপ্তারি পরোয়ানা জারি হয়েছে। তদন্ত শেষ না হওয়া পর্যন্ত {amount} সরকারি নিরাপদ অ্যাকাউন্টে জমা দিন, পরে ফেরত পাবেন।
- এটি গোপন মামলা। পরিবার বা ব্যাংককে কিছু জানাবেন না। ক্যামেরা চালু রাখুন, ঘর থেকে বেরোবেন না। কল কেটে দিলে {deadline} পুলিশ আপনার বাড়িতে পৌঁছে যাবে।
- আপনার ব্যাংক অ্যাকাউন্ট থেকে বেআইনি লেনদেন হয়েছে বলে সিবিআই মামলা করেছে। এখনই {phone} নম্বরে হোয়াটসঅ্যাপ ভিডিও কল করুন। {amount} সিকিউরিটি ডিপোজিট না দিলে {deadline} আপনার সব অ্যাকাউন্ট ফ্রিজ হয়ে যাবে।
notes: Bengali digital arrest
