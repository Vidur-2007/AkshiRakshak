pools:
  name: officials
templates:
- నేను సైబర్ క్రైమ్ బ్రాంచ్ నుండి {name} మాట్లాడుతున్నాను. మీ ఆధార్‌తో బుక్ అయిన పార్సెల్‌లో డ్రగ్స్ దొరికాయి. మీరు డిజిటల్ అరెస్ట్‌లో ఉన్నారు. వీడియో కాల్‌లోనే ఉండండి, ఎవరికీ చెప్పకండి.
- మీ మొబైల్ నంబర్ మనీ లాండరింగ్ కేసుతో ముడిపడి ఉంది. మీ పేరు మీద అరెస్ట్ వారెంట్ జారీ అయింది. విచారణ పూర్తయ్యే వరకు {amount} ప్రభుత్వ సురక్షిత ఖాతాకు పంపండి, తర్వాత తిరిగి ఇస్తాము.
- ఇది రహస్య కేసు. మీ కుటుంబానికి గానీ బ్యాంకుకు గానీ చెప్పకూడదు. కెమెరా ఆన్‌లో ఉంచండి, గది బయటకు వెళ్లకండి. కాల్ కట్ చేస్తే {deadline} పోలీసులు మీ ఇంటికి వస్తారు.
- మీ బ్యాంక్ ఖాతా నుండి అక్రమ లావాదేవీలు జరిగాయని సీబీఐ కేసు నమోదు చేసింది. వెంటనే {phone} కు వాట్సాప్ వీడియో కాల్ చేయండి. {amount} సెక్యూరిటీ డిపాజిట్ కట్టకపోతే {deadline} మీ ఖాతాలన్నీ ఫ్రీజ్ అవుతాయి.
notes: Telugu digital arrest
