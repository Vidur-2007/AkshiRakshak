family: arrest-hid-01
label: scam
category: digital_arrest
lang: hi
script: deva
channel: call
hard_negative: false
max_rows: 10
pools:
  name: officials
templates:
- मैं {name} साइबर क्राइम ब्रांच से बोल रहा हूं। आपके आधार से बुक हुए पार्सल में ड्रग्स मिले हैं। आप डिजिटल अरेस्ट में हैं। वीडियो कॉल पर बने रहें और किसी को कुछ न बताएं।
- आपका मोबाइल नंबर मनी लॉन्ड्रिंग के मामले से जुड़ा है। आपके नाम पर गिरफ्तारी वारंट जारी हुआ है। जांच पूरी होने तक {amount} सरकारी सुरक्षित खाते में जमा करें, पैसा बाद में वापस मिल जाएगा।
- यह गोपनीय मामला है। अपने परिवार या बैंक को कुछ मत बताइए। कैमरा चालू रखिए और कमरे से बाहर मत जाइए। कॉल काटी तो {deadline} पुलिस आपके घर पहुंचेगी।
notes: Devanagari digital arrest script
