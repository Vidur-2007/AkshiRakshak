templates:
- আমি মুম্বাই নারকোটিক্স বিভাগের ইন্সপেক্টর {name}। আপনার নামে বিদেশে যাওয়া পার্সেলে পাসপোর্ট আর মাদক পাওয়া গেছে। ভিডিও কলে জেরার জন্য হাজির হতে হবে।
- এই মামলা জাতীয় নিরাপত্তার। আপনার টাকা বৈধ কিনা যাচাই করতে পুরো {amount} আরবিআই যাচাই অ্যাকাউন্টে পাঠান। তদন্তের পরে ফেরত পাবেন।
- আপনি এখন ডিজিটাল হেফাজতে আছেন। ফোন রাখবেন না, কারও সঙ্গে কথা বলবেন না। প্রতি ঘণ্টায় রিপোর্ট করতে হবে, না হলে গ্রেপ্তারি পরোয়ানা জারি হবে।
- আমি সিবিআই অফিসার {name} বলছি। আপনার আধার দিয়ে খোলা অ্যাকাউন্টে হাওয়ালার টাকা ঢুকেছে। এখনই {phone} নম্বরে ভিডিও কল করুন, না হলে {deadline} পুলিশ আপনার বাড়ি যাবে।
