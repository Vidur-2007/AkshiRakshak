templates:
- 'ప్రియమైన కస్టమర్, మీ {bank} ఖాతా కేవైసీ అప్‌డేట్ కాలేదు. {deadline} ఖాతా బ్లాక్ అవుతుంది. వెంటనే ఈ లింక్‌ ద్వారా కేవైసీ పూర్తి చేయండి: {link}'
- '{bank} హెచ్చరిక: మీ కేవైసీ గడువు ముగిసింది. ఖాతా కొనసాగించడానికి వెంటనే {phone} కు కాల్ చేయండి.'
- 'మీ {bank} నెట్ బ్యాంకింగ్ నిలిపివేయబడింది. పాన్, ఆధార్ వివరాలు {deadline} ఇక్కడ నమోదు చేయండి, లేకపోతే ఖాతా ఫ్రీజ్ అవుతుంది: {link}'
notes: Telugu KYC block
