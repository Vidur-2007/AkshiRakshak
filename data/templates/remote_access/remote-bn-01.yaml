- '{amount} রিফান্ড হাতে করা সম্ভব নয়। {app} খুলে কোড বলুন, তারপর আপনার ব্যাংক অ্যাপ খুলে এমপিন দিন। আমি ধাপে ধাপে বলে দেব।'
