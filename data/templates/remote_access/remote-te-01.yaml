templates:
- ఈ సమస్య పరిష్కరించడానికి ప్లే స్టోర్ నుండి {app} ఇన్‌స్టాల్ చేసి, స్క్రీన్‌పై కనిపించే తొమ్మిది అంకెల కోడ్ నాకు చెప్పండి.
- మీ ఫోన్‌లో వైరస్ ఉంది, అందుకే యూపీఐ పనిచేయడం లేదు. {app} డౌన్‌లోడ్ చేసి అనుమతి ఇవ్వండి, నేను చెప్పే వరకు యాప్ మూసివేయకండి.
- '{amount} రీఫండ్ మాన్యువల్‌గా చేయడం కుదరదు. {app} తెరిచి కోడ్ చెప్పండి, తర్వాత మీ బ్యాంక్ యాప్ తెరిచి ఎంపిన్ ఎంటర్ చేయండి. నేను ఒక్కొక్క అడుగు చెప్తాను.'
