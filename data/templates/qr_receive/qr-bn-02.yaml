templates:
- আপনার সোফার জন্য {amount} দেব। পেমেন্টের জন্য এই কিউআর পাঠালাম, স্ক্যান করে পিন দিলেই টাকা আপনার অ্যাকাউন্টে ঢুকবে।
- '{amount} ক্যাশব্যাক পেতে এই কিউআর কোড স্ক্যান করে পরিমাণটা নিশ্চিত করুন। ভয় পাবেন না, টাকা আপনার কাছে আসবে, যাবে না।'
- আমি এখন শহরের বাইরে। কিউআর পাঠাচ্ছি, আপনার ফোনে স্ক্যান করে অ্যাপ্রুভ করুন। অগ্রিম {amount} জমা হয়ে যাবে।
notes: Bengali QR to receive
