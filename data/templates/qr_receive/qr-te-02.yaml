templates:
- మీ సోఫాకు {amount} ఇస్తాను. పేమెంట్ కోసం ఈ క్యూఆర్ పంపాను, స్కాన్ చేసి పిన్ ఎంటర్ చేస్తే డబ్బు వెంటనే మీ ఖాతాలో పడుతుంది.
- క్యాష్‌బ్యాక్ {amount} పొందడానికి ఈ క్యూఆర్ కోడ్ స్కాన్ చేసి మొత్తం నిర్ధారించండి. భయపడకండి, డబ్బు మీకు వస్తుంది, పోదు.
- సార్, నేను ఇప్పుడు ఊళ్లో లేను. క్యూఆర్ పంపుతున్నా, మీ ఫోన్‌తో స్కాన్ చేసి అప్రూవ్ చేయండి. అడ్వాన్స్ {amount} మీకు జమ అవుతుంది.
notes: Telugu QR to receive
