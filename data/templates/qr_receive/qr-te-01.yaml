templates:
- నేను మీకు క్యూఆర్ కోడ్ పంపుతున్నాను. దాన్ని మీ యూపీఐ యాప్‌తో స్కాన్ చేసి పిన్ ఎంటర్ చేయండి, {amount} నేరుగా మీ ఖాతాలోకి వస్తాయి.
- నేను ఆర్మీలో పని చేస్తున్నాను, మా చెల్లింపులు క్యూఆర్ ద్వారానే జరుగుతాయి. ముందు ఐదు రూపాయల కోడ్ స్కాన్ చేసి చూడండి, తర్వాత {amount} కోడ్ స్కాన్ చేయండి. డబ్బు మీకే వస్తుంది.
- మీ వస్తువు నాకు నచ్చింది, {amount} కు తీసుకుంటాను. ఇప్పుడే క్యూఆర్ పంపుతాను, స్కాన్ చేసి పిన్ కొడితే డబ్బు మీ ఖాతాలో పడుతుంది.
