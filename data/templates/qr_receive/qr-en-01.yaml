family: qr-en-01
label: scam
category: qr_receive
lang: en
script: latn
channel: whatsapp
hard_negative: false
max_rows: 14
pools:
  upi: upi_ids.buyer
templates:
- I am sending you a QR code. Scan it with your UPI app and enter your PIN, you will receive {amount} in your account immediately.
- Sir payment for your item is ready. Scan the QR I sent, it will show {amount}, then put your PIN to receive it. This is how army accounts transfer money.
- To receive the advance of {amount}, please scan this QR and approve. Do not worry, the money will come to you, scanning is only for confirmation.
- First scan the QR for Rs 5 as a test. Good, now scan the second one for {amount} to get the full payment. Enter your PIN quickly, the code expires {deadline}.
- Madam your refund QR is generated. Open any UPI app, scan and confirm with PIN to credit {amount}. If it shows debit do not worry, it will be reversed and doubled.
notes: Scan this QR to receive money
