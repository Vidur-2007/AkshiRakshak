family: wrong-en-01
label: scam
category: wrong_transfer
lang: en
script: latn
channel: whatsapp
hard_negative: false
max_rows: 14
pools:
  upi: upi_ids.personal
templates:
- Hello, I sent {amount} to your number by mistake instead of my brother. Please send it back to {upi}. I am a poor person, it is my hospital money.
- Sir, wrong transfer happened from my side. {amount} has come to your account, I am sending the screenshot. Kindly return it on {phone} by UPI {deadline}.
- Bhaiya by mistake I recharged your UPI with {amount}. Please return, I am sending you a request, just approve it and enter the PIN.
- You received {amount} from me just now, it was meant for my landlord. Please transfer it back to {upi} urgently or I will have to complain to the police.
- Hi, I typed one digit wrong and the money went to you. I have sent a refund request of {amount} in your UPI app, please accept it. God bless you.
notes: Sent by mistake, please return
