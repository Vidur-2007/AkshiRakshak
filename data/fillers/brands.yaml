# Non-bank brands for the {brand} slot, grouped by kind. A family picks a group with `pools: { brand: brands.<kind> }`.
# `domains` are official (same as the engine registry); legit rows link only to these. Utilities have no
# single official domain, so legit utility rows name the official app/portal in words instead of linking.
brands:
  courier:
    - { id: indiapost, name: { latn: India Post, deva: इंडिया पोस्ट, telu: ఇండియా పోస్ట్, beng: ইন্ডিয়া পোস্ট }, domains: [indiapost.gov.in] }
    - { id: bluedart, name: { latn: Blue Dart, deva: ब्लू डार्ट, telu: బ్లూ డార్ట్, beng: ব্লু ডার্ট }, domains: [bluedart.com] }
    - { id: dtdc, name: { latn: DTDC, deva: डीटीडीसी, telu: డీటీడీసీ, beng: ডিটিডিসি }, domains: [dtdc.com] }
    - { id: delhivery, name: { latn: Delhivery, deva: डेल्हीवरी, telu: డెల్హివరీ, beng: দিল্লিভারি }, domains: [delhivery.com] }
    - { id: fedex, name: { latn: FedEx, deva: फेडेक्स, telu: ఫెడెక్స్, beng: ফেডেক্স }, domains: [fedex.com] }
  ecommerce:
    - { id: amazon, name: { latn: Amazon, deva: अमेज़न, telu: అమెజాన్, beng: অ্যামাজন }, domains: [amazon.in] }
    - { id: flipkart, name: { latn: Flipkart, deva: फ्लिपकार्ट, telu: ఫ్లిప్‌కార్ట్, beng: ফ্লিপকার্ট }, domains: [flipkart.com] }
  payment_app:
    - { id: paytm, name: { latn: Paytm, deva: पेटीएम, telu: పేటీఎం, beng: পেটিএম }, domains: [paytm.com] }
    - { id: phonepe, name: { latn: PhonePe, deva: फोनपे, telu: ఫోన్‌పే, beng: ফোনপে }, domains: [phonepe.com] }
    - { id: gpay, name: { latn: Google Pay, deva: गूगल पे, telu: గూగుల్ పే, beng: গুগল পে }, domains: [google.com] }
    - { id: bhim, name: { latn: BHIM, deva: भीम, telu: భీమ్, beng: ভীম }, domains: [bhimupi.org.in] }
  telecom:
    - { id: jio, name: { latn: Jio, deva: जियो, telu: జియో, beng: জিও }, domains: [jio.com] }
    - { id: airtel, name: { latn: Airtel, deva: एयरटेल, telu: ఎయిర్‌టెల్, beng: এয়ারটেল }, domains: [airtel.in] }
    - { id: vi, name: { latn: Vi, deva: वीआई, telu: వీఐ, beng: ভিআই }, domains: [myvi.in] }
  govt:
