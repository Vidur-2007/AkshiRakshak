    - { id: discom, name: { latn: Power Distribution Office, deva: बिजली वितरण कार्यालय, telu: విద్యుత్ పంపిణీ కార్యాలయం, beng: বিদ্যুৎ বণ্টন অফিস }, domains: [] }
    - { id: gas, name: { latn: Gas Agency, deva: गैस एजेंसी, telu: గ్యాస్ ఏజెన్సీ, beng: গ্যাস এজেন্সি }, domains: [] }
