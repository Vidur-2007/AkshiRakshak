    - { id: epfo, name: { latn: EPFO, deva: ईपीएफओ, telu: ఈపీఎఫ్ఓ, beng: ইপিএফও }, domains: [epfindia.gov.in] }
    - { id: parivahan, name: { latn: Parivahan, deva: परिवहन, telu: పరివాహన్, beng: পরিবহন }, domains: [parivahan.gov.in] }
